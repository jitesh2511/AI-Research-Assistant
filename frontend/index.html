<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant</title>
    <script src="js/main.js" defer></script>
</head>
<body>
    <main>

        <div class="health-check">
            <button id="health-check-btn">
                Check
            </button>
            <p id="health-status"></p>
        </div>

        <div class="pdf-upload">
            <input type="file" id="pdf-upload-input" accept="application/pdf" multiple>
            <br>
            <h3>Uploaded Files</h3>
            <div id="pdf-upload-list">
            </div>
        </div>

        <div class="faiss">
            <button id="faiss_index_btn">Get Index Stats</button>
            <div id="index_stats">

            </div>
        </div>
        <br><br>
        <div class="retrieval">
            <textarea id="query" rows="10" cols="50" placeholder="Your query"></textarea>
            <br>
            <button id="search-btn">Search</button>
            <div id="retrieval-content">

            </div>
        </div>

    </main>
</body>
</html>
